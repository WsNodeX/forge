[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-tokenizer"
version = "1.0.0"
description = "A dependency-free Python toolkit for training and running subword (BPE) tokenizers with byte-level fallback."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["tokenizer", "bpe", "nlp", "llm", "subword", "embeddings", "text"]
authors = [{ name = "WsNodeX" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/WsNodeX/forge"
Repository = "https://github.com/WsNodeX/forge"

[project.optional-dependencies]
dev = ["build"]

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge*"]
